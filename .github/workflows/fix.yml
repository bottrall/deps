# Reusable: called from each repo's deps.yml on `workflow_run` of its CI for
# renovate/** branches. A red run gets a fix attempt; a green run on a branch
# the fixer has taken over gets merged when the fixer's changes are safe.
#
# A fix is split across two jobs on separate machines so the App's write token
# never sits next to the freshly updated dependencies' code: `attempt` runs
# that code and the agent with read-only credentials and hands over a patch;
# `publish` holds the token, runs none of the repo's code, checks the patch
# and pushes it.
#
# Secrets (via `secrets: inherit`): DEPS_APP_CLIENT_ID, DEPS_APP_PRIVATE_KEY.
# The agent authenticates to Anthropic with Workload Identity Federation (the
# caller must grant `id-token: write`), or with an ANTHROPIC_API_KEY secret
# when the federation inputs are empty.

name: deps-fix

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-haiku-5-5
      reasoning:
        type: string
        default: xhigh
      max-steps:
        type: number
        default: 60
      max-attempts:
        type: number
        default: 2
      # The deps-fixer rule and bottrall-bot service account in the
      # "GitHub automation" workspace. Not secret: the rule only accepts
      # identity tokens from this workflow on main.
      anthropic-organization-id:
        type: string
        default: b72f8de6-2562-4a56-89a9-19b7ac8b021e
      anthropic-federation-rule-id:
        type: string
        default: fdrl_01T6SrNGcrYKSYAeV4bsAVwK
      anthropic-service-account-id:
        type: string
        default: svac_01YVUwN7h5MiyvK6SmDBYyWv
      anthropic-workspace-id:
        description: Needed only when the federation rule covers more than one workspace
        type: string
        default: ""
      safe-paths:
        description: Regexes (one per line) for files a fixer commit may touch and still merge without review
        type: string
        default: |
          ^Gemfile\.lock$
          ^pnpm-lock\.yaml$
          ^package-lock\.json$
          ^rbs_collection\.lock\.yaml$
          ^sig/
          ^test/
          ^spec/
          ^\.rubocop(_todo)?\.yml$

env:
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.event.workflow_run.head_branch }}
  BASE: ${{ github.event.repository.default_branch }}
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  SAFE_PATHS: ${{ inputs.safe-paths }}
  MODEL: ${{ inputs.model }}
  REASONING: ${{ inputs.reasoning }}
  # CI's completion often arrives after Renovate has merged and deleted the
  # branch, or after a newer push; either way there's nothing to do.
  CURRENT_CHECK: |
    head=$(gh api "repos/${REPO}/branches/${BRANCH}" --jq .commit.sha 2>/dev/null) || head=""
    if [[ $head == "$HEAD_SHA" ]]; then
      echo ok=true >>"$GITHUB_OUTPUT"
    else
      echo "ok=false" >>"$GITHUB_OUTPUT"
      echo "Skipping: ${BRANCH} is ${head:-gone} rather than ${HEAD_SHA}." >>"$GITHUB_STEP_SUMMARY"
    fi
  FETCH_TOOLING: |
    curl -fsSL https://github.com/bottrall/deps/archive/refs/heads/main.tar.gz | tar -xz -C "$RUNNER_TEMP"
    echo "TOOLING=$RUNNER_TEMP/deps-main" >>"$GITHUB_ENV"

jobs:
  attempt:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    concurrency:
      group: deps-attempt-${{ github.event.workflow_run.head_branch }}
    outputs:
      current: ${{ steps.current.outputs.ok }}
    steps:
      - name: Skip if the branch is gone or has moved on
        id: current
        run: bash -c "$CURRENT_CHECK"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@v7
        if: steps.current.outputs.ok == 'true'
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch tooling
        if: steps.current.outputs.ok == 'true'
        run: bash -c "$FETCH_TOOLING"

      - uses: ruby/setup-ruby@v1
        if: steps.current.outputs.ok == 'true' && hashFiles('Gemfile.lock') != ''
        with:
          bundler-cache: true

      - uses: pnpm/action-setup@v6
        if: steps.current.outputs.ok == 'true' && hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v7
        if: steps.current.outputs.ok == 'true' && hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.current.outputs.ok == 'true' && hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Attempt a fix
        if: steps.current.outputs.ok == 'true'
        run: bash "$TOOLING/scripts/attempt.sh"
        env:
          OUT: ${{ runner.temp }}/attempt
          ACTIONS_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          MAX_STEPS: ${{ inputs.max-steps }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          ANTHROPIC_ORGANIZATION_ID: ${{ inputs.anthropic-organization-id }}
          ANTHROPIC_FEDERATION_RULE_ID: ${{ inputs.anthropic-federation-rule-id }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ inputs.anthropic-service-account-id }}
          ANTHROPIC_WORKSPACE_ID: ${{ inputs.anthropic-workspace-id }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: actions/upload-artifact@v7
        if: steps.current.outputs.ok == 'true'
        with:
          name: deps-attempt
          path: ${{ runner.temp }}/attempt
          retention-days: 3

  publish:
    needs: attempt
    # Also runs when the attempt crashed (setup can't install a lockfile
    # Renovate failed to update, say), so the PR is handed to a human rather
    # than left red with no word; publish.sh then ignores the attempt's output.
    if: >-
      always() &&
      needs.attempt.outputs.current == 'true' &&
      (needs.attempt.result == 'success' || needs.attempt.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: deps-${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Skip if the branch is gone or has moved on
        id: current
        run: bash -c "$CURRENT_CHECK"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - uses: actions/checkout@v7
        if: steps.current.outputs.ok == 'true'
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: steps.current.outputs.ok == 'true' && needs.attempt.result == 'success'
        with:
          name: deps-attempt
          path: ${{ runner.temp }}/attempt

      - name: Fetch tooling
        if: steps.current.outputs.ok == 'true'
        run: bash -c "$FETCH_TOOLING"

      - name: Publish
        if: steps.current.outputs.ok == 'true'
        run: bash "$TOOLING/scripts/publish.sh"
        env:
          IN: ${{ runner.temp }}/attempt
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ATTEMPT_RESULT: ${{ needs.attempt.result }}
          MAX_ATTEMPTS: ${{ inputs.max-attempts }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: deps-${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.DEPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPS_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Renovate's branches bump actions in .github/workflows/, and GitHub
          # won't let an App merge those changes without it.
          permission-workflows: write
          # gh's check rollup reads each check run's workflow name.
          permission-actions: read
          permission-checks: read
          permission-statuses: read

      - name: Skip if the branch is gone or has moved on
        id: current
        run: bash -c "$CURRENT_CHECK"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}

      - uses: actions/checkout@v7
        if: steps.current.outputs.ok == 'true'
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Fetch tooling
        if: steps.current.outputs.ok == 'true'
        run: bash -c "$FETCH_TOOLING"

      - name: Merge
        if: steps.current.outputs.ok == 'true'
        run: bash "$TOOLING/scripts/merge.sh"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
